worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    # Debian's mime.types has no .mjs; browsers refuse module scripts (the
    # MapLibre map worker) served as application/octet-stream.
    types {
        text/javascript mjs;
    }
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 100M;

    upstream api {
        server 127.0.0.1:3219;
    }

    server {
        listen 4321;
        server_name _;

        # API routes - proxy to API service
        location /api/ {
            proxy_pass http://api/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Upload chunks (PUT /api/upload/:id). The web client sends 8 MB
        # chunks and the API refuses more than 32 MB per request. Stream the
        # body to the API as it arrives instead of spooling it to disk first,
        # and allow slow phone connections.
        location /api/upload/ {
            proxy_pass http://api/upload/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 40M;
            client_body_timeout 300s;
            proxy_request_buffering off;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Everything else - serve Angular static build
        location / {
            root /app/web/dist/opengallery/browser;
            try_files $uri $uri/ /index.html;
        }
    }
}
